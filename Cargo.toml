[workspace]
members = [
    "crates/phalanx-proto",
    "crates/phalanx-forensics",
    "crates/phalanx-transport",
    "crates/phalanx-node",
    "crates/phalanx-lens",
    "crates/phalanx-ffi",
    "crates/phalanx-sim",
    "crates/phalanx-stronghold",
    "crates/phalanx-test-fixtures",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Phalanx Core Team"]
rust-version = "1.93.1"
license = "Apache-2.0"

[workspace.dependencies]
phalanx-proto = { path = "crates/phalanx-proto" }
phalanx-forensics = { path = "crates/phalanx-forensics" }
phalanx-transport = { path = "crates/phalanx-transport" }
phalanx-node = { path = "crates/phalanx-node" }
phalanx-ffi = { path = "crates/phalanx-ffi" }
phalanx-lens = { path = "crates/phalanx-lens" }
phalanx-test-fixtures = { path = "crates/phalanx-test-fixtures" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.49", features = ["full"] }
libp2p = { version = "0.56", features = ["gossipsub", "kad", "tcp", "noise", "yamux", "quic"] }
postcard = { version = "1.1.3", features = ["alloc"] }
tracing = "0.1.44"

[workspace.lints.rust]
# Catch private items (and pub items in binary crates) with no callers at PR time
# rather than at handoff. Pub items in library crates aren't caught here — for
# those, watch for `unreachable_pub` once visibility is tightened consistently.
dead_code = "deny"

[workspace.lints.clippy]
# Disable style warnings
pedantic = { level = "allow", priority = -1 }
style = { level = "allow", priority = -1 }

# Forensic Zero-Trust: Reliability
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Forensic Zero-Trust: Data Integrity
cast_possible_truncation = "deny"
arithmetic_side_effects = "deny"
cast_sign_loss = "deny"            
cast_possible_wrap = "deny"        
float_cmp = "deny"                

# Concurrency Hygiene
await_holding_lock = "deny"
large_futures = "warn"

# Code Quality
cognitive_complexity = "warn"
undocumented_unsafe_blocks = "deny"
todo = "warn"

# E5 DIAGNOSTIC (docs/profiling.md): debug symbols in
# release builds enable function-level attribution from sampling profilers
# (samply, perf, cargo-flamegraph). No code-gen impact, only larger binaries.
# Remove if release artifact size becomes a concern.
[profile.release]
debug = true