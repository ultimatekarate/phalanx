[package]
name = "phalanx"
version = "0.1.0"
edition = "2021"

[dependencies]
# The Networking Engine
libp2p = { version = "0.56.0", features = ["tcp", "quic", "gossipsub", "mdns", "tokio","noise", "yamux", "macros"] }
# Async Runtime
tokio = { version = "1.0", features = ["full"] }
# Logging
env_logger = "0.11"
log = "0.4"

# Security & Identity
# rand_core feature is mandatory for the .generate() method
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand = "0.9.2"
hex = "0.4"
dalek_rand = { package = "rand_core", version = "0.6.4", features = ["std"] }

# Data & Hardware
serde = { version = "1.0", features = ["derive"] } 
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
nokhwa = { version = "0.10", features = ["input-msmf"] }
ctrlc = "3.4"
ndarray = "0.17.2"
image = { version = "0.25.9", features = ["jpeg"] }
toml = "0.9.8"