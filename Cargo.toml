[workspace]
members = [
    "crates/phalanx-proto",
    "crates/phalanx-forensics",
    "crates/phalanx-transport",
    "crates/phalanx-node",
    "crates/phalanx-lens",
    "crates/phalanx-ffi",
    "crates/phalanx-sim",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Phalanx Core Team"]
rust-version = "1.93.1"

[workspace.dependencies]
phalanx-proto = { path = "crates/phalanx-proto" }
phalanx-forensics = { path = "crates/phalanx-forensics" }
phalanx-transport = { path = "crates/phalanx-transport" }
phalanx-node = { path = "crates/phalanx-node" }
phalanx-ffi = { path = "crates/phalanx-ffi" }
phalanx-ui = { path = "crates/phalanx-ui" }
phalanx-lens = { path = "crates/phalanx-lens" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.49", features = ["full"] }
libp2p = { version = "0.56", features = ["gossipsub", "kad", "tcp", "noise", "yamux", "quic"] }
postcard = { version = "1.1.3", features = ["alloc"] }
tracing = "0.1.44"

[patch.crates-io]
gear-dlmalloc = { path = "./patches/gear-dlmalloc" }

[workspace.lints.clippy]
# Disable style warnings
pedantic = { level = "allow", priority = -1 }
style = { level = "allow", priority = -1 }

# Forensic Zero-Trust: Reliability
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Forensic Zero-Trust: Data Integrity
cast_possible_truncation = "warn"
arithmetic_side_effects = "warn"
cast_sign_loss = "deny"            
cast_possible_wrap = "deny"        
float_cmp = "deny"                

# Concurrency Hygiene
await_holding_lock = "deny"
large_futures = "warn"

# Code Quality
cognitive_complexity = "warn"
undocumented_unsafe_blocks = "deny"
todo = "warn"