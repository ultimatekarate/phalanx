[workspace]
resolver = "2"
members = [
    "crates/phalanx-core",
    "crates/phalanx-ffi",
    "crates/phalanx-dashboard"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Phalanx Core Team"]
rust-version = "1.93.1"

[workspace.dependencies]
tokio = { version = "1.49", features = ["full"] }
libp2p = { version = "0.56", features = ["gossipsub", "kad", "tcp", "noise", "yamux"] }
postcard = { version = "1.1.3", features = ["alloc"] }
tracing = "0.1.44"

[patch.crates-io]
gear-dlmalloc = { path = "./patches/gear-dlmalloc" }