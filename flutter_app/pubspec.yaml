name: phalanx
description: "Forensic-grade video capture with mesh distribution. The Mouth and Ears."
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  flutter_riverpod: ^2.4.0
  camera: ^0.11.0
  record: 5.1.2
  battery_plus: ^6.0.0
  share_plus: ^7.0.0
  app_links: ^6.0.0
  flutter_pcm_sound: ^3.3.0
  # Community QR scanning for the Join ceremony (Phase 3 UI).
  mobile_scanner: ^5.0.0
  # Response-QR rendering on the voucher's Signed screen (Phase 7).
  # Symmetric to the Stronghold ceremony panel's request-QR render.
  qr_flutter: ^4.1.0
  # File picker for Import-from-file fallback on the Vouch scan stage
  # and Save-to-file on the Vouch signed stage (Phase 7).
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.0
  # ffigen: ^9.0.0  # Removed — using hand-written Dart FFI bindings

# Override broken record_linux — it fails to implement startStream from the
# platform interface. We only target Android/iOS, so this is unused at runtime.
# Remove this override when record_linux ships a compatible version.
dependency_overrides:
  record_linux: 0.7.1
  record_platform_interface: 1.1.0

flutter:
  uses-material-design: true
