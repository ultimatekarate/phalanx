# flutter_app/ffigen.yaml
#
# Configuration for dart run ffigen — auto-generates Dart FFI bindings
# from the cbindgen-generated phalanx.h C header.
#
# Usage: cd flutter_app && dart run ffigen
# Output: lib/ffi/phalanx_bindings.dart
#
# This is the second half of the toolchain:
#   Rust → cbindgen → phalanx.h → ffigen → phalanx_bindings.dart

name: PhalanxBindings
description: Auto-generated FFI bindings for phalanx-ffi C-ABI.
output: 'lib/ffi/phalanx_bindings.dart'

headers:
  entry-points:
    - '../crates/phalanx-ffi/phalanx.h'

# Only include phalanx_ prefixed symbols
functions:
  include:
    - 'phalanx_.*'

structs:
  include:
    - 'PhalanxHandle'

enums:
  include:
    - 'PhalanxError'

# Map C types to Dart types
type-map:
  'uint8_t': 'ffi.Uint8'
  'uint32_t': 'ffi.Uint32'
  'uint64_t': 'ffi.Uint64'
  'int32_t': 'ffi.Int32'
  'bool': 'ffi.Bool'

# Suppress documentation noise
comments:
  style: any
  length: full

preamble: |
  // AUTO-GENERATED — do not edit manually.
  // Generated by `dart run ffigen` from phalanx.h
  // Regenerate: cd flutter_app && dart run ffigen
