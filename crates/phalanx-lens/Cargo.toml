[package]
name = "phalanx-lens"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Forensic Eye: SIMD-accelerated sensor fingerprinting for evidence provenance."

[dependencies]
phalanx-proto = { path = "../phalanx-proto" }

[features]
default = ["scalar"]
scalar = []
neon = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "forensic_lens"
harness = false

[lints]
workspace = true
