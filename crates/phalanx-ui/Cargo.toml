[package]
name = "phalanx-ui"
version = "0.1.0"
edition = "2021"
description = "Phalanx playback sinks: ephemeral video player and C2PA-signed export."

[dependencies]
phalanx-proto = { path = "../phalanx-proto" }
phalanx-forensics = { path = "../phalanx-forensics" }
c2pa = { version = "0.78.0", default-features = false, features = ["rust_native_crypto", "file_io"] }
zeroize = "1"
tokio = { version = "1.0", features = ["sync"] }
async-trait = "0.1"
anyhow = "1"
