[package]
name = "phalanx-transport"
version = "0.1.0"
edition.workspace = true
description = "The Phalanx Post Office: Handling the Prepositions of the Mesh."

[dependencies]
# The Foundation
phalanx-proto = { path = "../phalanx-proto" }

# Async & Networking
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Physical Adapters (The "Across")
# For P2P Mesh logic (Gossipsub/DHT)
# E1 FIX: connection_limits module is unconditionally available in libp2p 0.56
libp2p = { version = "0.56", features = ["gossipsub", "noise", "yamux", "tcp", "tokio", "macros", "dns", "kad", "request-response", "identify", "autonat", "relay", "dcutr", "mdns", "pnet", "quic"] }

# Utilities
tracing = "0.1"
postcard.workspace = true
rand = "0.8.0"
zeroize = "1.8.2"

[dev-dependencies]
# For testing our Prepositional logic
tempfile = "3.26.0"

[lints]
workspace = true
