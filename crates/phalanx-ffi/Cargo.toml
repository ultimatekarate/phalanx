[package]
name = "phalanx-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "C-ABI bridge for Flutter/mobile integration. The Larynx of the linguistic model."

[lib]
# "cdylib" for Android (.so), "staticlib" for iOS (.a).
# "rlib" is dev-only: it lets `tests/*.rs` integration tests link against
# the crate so the FFI surface can be exercised through its `extern "C"`
# functions, not just the in-tree `#[cfg(test)]` modules. The mobile
# deliverables (cdylib/staticlib) are unaffected.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Workspace crates
phalanx-node = { workspace = true }
phalanx-proto = { workspace = true }
phalanx-forensics = { workspace = true }
phalanx-transport = { workspace = true }
phalanx-lens = { workspace = true }

# Runtime
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

# FFI
serde = { workspace = true }
serde_json = "1.0"
postcard = { workspace = true }

# C2PA export (rust_native_crypto avoids OpenSSL dependency)
c2pa = { version = "0.85.0", default-features = false, features = ["rust_native_crypto", "file_io"] }

# Ed25519 signing (for C2PA signer)
ed25519-dalek = { version = "2.1", features = ["serde", "zeroize"] }
rand = "0.8"

# Secure memory wiping for mnemonic strings in FFI
zeroize = "1"

# Android logcat output for diagnostics
[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"
# Runtime resolution of the ATrace symbols (API 23+) for the Perfetto bridge.
libloading = "0.8"

# Dev-only: integration tests bootstrap a real engine in a tempdir.
[dev-dependencies]
tempfile = "3.26"

[lints]
workspace = true
