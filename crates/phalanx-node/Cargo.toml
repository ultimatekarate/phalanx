[package]
name = "phalanx-node"
version = "0.1.0"
edition.workspace = true
description = "The Sentence: Orchestrating the StorageActor, Sentinel, and Production Runtime."

[lib]
name = "phalanx_node"
path = "src/lib.rs"

[[bin]]
name = "sentinel"
path = "src/bin/sentinel.rs"

[dependencies]
# The Linguistic Foundation
phalanx-proto = { path = "../phalanx-proto" }
phalanx-forensics = { path = "../phalanx-forensics" }
phalanx-transport = { path = "../phalanx-transport" }
phalanx-lens = { path = "../phalanx-lens" }

# Runtime & Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# CLI & Configuration (The "Interface" Prepositions)
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Cryptography, Time & Identity
bip39 = "2.0"
ed25519-dalek = { version = "2.0", features = ["zeroize"] }
rand = {version = "0.10.0", features = ["std"]}
rand_core = { version = "0.6", features = ["std"] }
sntpc = {version = "0.8.1", features = ["std", "utils"]}

# Storage
redb = "3.1.0"
# OS-correct data directories for the shipped sentinel node (vault/identity/WAL/logs).
directories = "5"

# Serialization & Errors
postcard = { version = "1.1.3", features = ["alloc"] }
thiserror = "2.0.18"
anyhow = "1.0"
tempfile = "3.26.0"
oneshot = "0.2.1"
ctrlc = "3.5.2"
blake3 = "1.8"
zeroize = "1.8.2"

# Stability analysis (optional)
nalgebra = { version = "0.33", optional = true }

[dev-dependencies]
phalanx-test-fixtures = { workspace = true }
tokio = { version = "1.0", features = ["full", "test-util"] }

[lints]
workspace = true

[features]
stability-analysis = ["dep:nalgebra"]
