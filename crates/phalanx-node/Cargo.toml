[package]
name = "phalanx-node"
version = "0.1.0"
edition = "2021"
description = "The Sentence: Orchestrating the StorageActor, Sentinel, and Production Runtime."

[lib]
name = "phalanx_node"
path = "src/lib.rs"

[[bin]]
name = "sentinel"
path = "src/bin/sentinel.rs"

[dependencies]
# The Linguistic Foundation
phalanx-proto = { path = "../phalanx-proto" }
phalanx-forensics = { path = "../phalanx-forensics" }
phalanx-transport = { path = "../phalanx-transport" }

# Runtime & Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# CLI & Configuration (The "Interface" Prepositions)
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
config = "0.15.19"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Cryptography, Time & Identity
bip39 = "2.0"
bs58 = "0.5"
ed25519-dalek = "2.0"
rand = {version = "0.10.0", features = ["std"]}
rand_core = { version = "0.6", features = ["std"] }
sntpc = {version = "0.8.1", features = ["std", "utils"]}

# Storage & Networking
redb = "3.1.0"
libp2p = { version = "0.56.0", features = ["kad"] }

# Serialization & Errors
postcard = { version = "1.1.3", features = ["alloc"] }
thiserror = "2.0.18"
anyhow = "1.0"
tempfile = "3.26.0"
oneshot = "0.2.1"
ctrlc = "3.5.2"
lru = "0.16.3"
