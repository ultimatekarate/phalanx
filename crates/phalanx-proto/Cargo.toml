[package]
name = "phalanx-proto"
version = "0.1.0"
edition = "2021"
description = "The Phalanx Dictionary: Nouns, Tenses, and Evidence Contracts"


[dependencies]
# The Serialization Engine
serde = { version = "1.0", features = ["derive", "rc"] }
postcard = { version = "1.1.3", features = ["alloc"] }
# Identity & Cryptographic Nouns
# We keep these minimal to avoid heavy build times in the UI/Sim crates
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3.30"
futures-channel = "0.3.30"
# Errors & Utilities
thiserror = "2.0.18"
async-trait = "0.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] } # For the "When"
bs58 = "0.5.1"
tracing.workspace = true
rand = { version = "0.9", features = ["std"]}
blake3 = "1.8.3"
base64 = "0.22.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# For property-based testing of our Nouns
proptest = "1.4"
# For integration tests that need signing/verification (WitnessAuthority lives in forensics)
phalanx-forensics = { path = "../phalanx-forensics" }

[lints]
workspace = true