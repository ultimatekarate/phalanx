[package]
name = "phalanx-forensics"
version = "0.1.0"
edition.workspace = true
description = "The Phalanx Laboratory: Verbs, Integrity Judges, and the Evidence Weaver."

[lib]
# No lib-level benchmarks: disabling the lib as a bench target keeps `cargo
# bench` from invoking the libtest harness, which rejects criterion CLI flags
# such as `--save-baseline`.
bench = false

[dependencies]
# The Linguistic Foundation
phalanx-proto = { path = "../phalanx-proto" }
phalanx-lens = { path = "../phalanx-lens" }

# Error Handling & Logic
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
postcard = "1.0"

# Cryptographic Verbs (The "Judge" needs these)
# These live here so the proto crate stays lightweight
ed25519-dalek = { version = "2.1", features = ["serde", "zeroize"] }
rand_core = { version = "0.6", features = ["std"] }

# Utilities
async-trait = "0.1" # If we have async Verbs (like database checks)
sha2 = "0.10.9"
hkdf = "0.12"
chacha20poly1305 = "0.10.1"
curve25519-dalek = "4.1.3"
x25519-dalek = {version = "2.0.1", features = ["static_secrets"]}
blake3 = "1.8.3"
argon2 = "0.5"
zeroize = "1"
bip39 = "2.0"
serde_json = "1"
hex = "0.4"
rcgen = "0.13"
rustls-pki-types = "1"
turbojpeg = "1.3"
bs58 = "0.5.1"
lz4_flex = "0.11"
raptorq = "2"
c2pa = {version="0.85.0", default-features = false, features = ["rust_native_crypto"]}

# Video/Audio encoding — pure byte transformations (no IO).
# Optional + behind `software-transcode`: EXCLUDED from FOSS/mobile builds,
# where a native platform encoder (MediaCodec/VideoToolbox) replaces them.
# `fdk-aac` is non-free (no patent grant); a self-built `openh264` is
# patent-exposed; `mp4` is only the software mux path.
openh264 = { version = "0.6", optional = true }
fdk-aac = { version = "0.6", optional = true }
mp4 = { version = "0.14", optional = true }

[features]
# The software H.264/AAC/MP4 transcode backend (`SoftwareTranscoder`). Default
# OFF — fail-closed, so the non-free / patent-encumbered codecs can never land
# in a FOSS mobile build by accident. Servers (Stronghold) and desktop/dev/CI
# opt in explicitly.
software-transcode = ["dep:openh264", "dep:fdk-aac", "dep:mp4"]

[dev-dependencies]
# For testing the Weaver without a network
tokio = { version = "1.0", features = ["macros", "rt"] }
phalanx-test-fixtures = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "witness"
harness = false

[lints]
workspace = true
