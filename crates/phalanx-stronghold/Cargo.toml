[package]
name = "phalanx-stronghold"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Stronghold: Desktop/server corroboration and evidence aggregation."

[lib]
name = "phalanx_stronghold"
path = "src/lib.rs"

[[bin]]
name = "stronghold"
path = "src/bin/stronghold.rs"

[[bin]]
name = "stronghold-gui"
path = "src/bin/stronghold_gui.rs"
required-features = ["gui"]

[dependencies]
# The Linguistic Foundation
phalanx-proto = { path = "../phalanx-proto" }
# The Stronghold is a wall-power server: it always uses the software H.264/AAC
# transcode backend for autonomous export (no platform encoder, no FOSS-mobile
# constraint here).
phalanx-forensics = { path = "../phalanx-forensics", features = ["software-transcode"] }
phalanx-transport = { path = "../phalanx-transport" }

# Runtime & Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# CLI & Configuration
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "std"], default-features = false }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography & Hashing
ed25519-dalek = { version = "2.0", features = ["zeroize"] }
rand_core = { version = "0.6", features = ["std"] }
blake3 = "1.8"
zeroize = "1.8.2"

# Serialization & Errors
postcard = { version = "1.1.3", features = ["alloc"] }
thiserror = "2.0.18"
oneshot = { version = "0.2.1", features = ["async"] }

# Export
c2pa = { version = "0.85.0", default-features = false, features = ["rust_native_crypto", "file_io"] }

# System
ctrlc = "3.5.2"
# OS-correct data directories for the shipped daemon (vault/identity/proofs).
directories = "5"

# GUI (optional, feature-gated)
eframe = { version = "0.30", optional = true, default-features = false, features = ["glow", "default_fonts"] }
# AsyncFileDialog is built-in (no feature flag); the Ceremony panel uses
# it because the sync FileDialog::pick_file blocks the egui event loop —
# unacceptable in a narrated demo. Dialogs are awaited in tokio tasks and
# dropped back onto the panel via AsyncReply<PathBuf>.
rfd = { version = "0.15", optional = true }
# QR rendering for the Ceremony panel (request-slot QRs + final join QR).
# Used only under the gui feature; feature-gated alongside eframe.
# default-features disabled to avoid pulling in the `image` crate —
# we paint ColorImage pixels from QrCode::to_colors() directly.
qrcode = { version = "0.14", optional = true, default-features = false }

[features]
default = []
gui = ["eframe", "rfd", "qrcode"]

[dev-dependencies]
# Cross-crate topic-alignment guard (tests/topic_alignment.rs): the node's and
# the Stronghold's compiled topic defaults must agree, and only a test that
# sees both crates can assert it. Dev-only — the runtime crates stay decoupled.
phalanx-node = { path = "../phalanx-node" }
tempfile = "3.26.0"
oneshot = { version = "0.2.1", features = ["async"] }
postcard = { version = "1.1.3", features = ["alloc"] }
phalanx-test-fixtures = { workspace = true }
# test-util unlocks `tokio::time::pause` / `tokio::time::advance` for
# `#[tokio::test(start_paused = true)]` in AsyncReply timeout tests.
# Dev-only — do not promote to [dependencies].
tokio = { version = "1.0", features = ["full", "test-util"] }

[lints]
workspace = true
