[package]
name = "phalanx-stronghold"
version = "0.1.0"
edition = "2021"
description = "The Stronghold: Desktop/server corroboration and evidence aggregation."

[lib]
name = "phalanx_stronghold"
path = "src/lib.rs"

[[bin]]
name = "stronghold"
path = "src/bin/stronghold.rs"

[[bin]]
name = "stronghold-gui"
path = "src/bin/stronghold_gui.rs"
required-features = ["gui"]

[dependencies]
# The Linguistic Foundation
phalanx-proto = { path = "../phalanx-proto" }
phalanx-forensics = { path = "../phalanx-forensics" }
phalanx-transport = { path = "../phalanx-transport" }

# Runtime & Async
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# CLI & Configuration
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "std"], default-features = false }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography & Hashing
ed25519-dalek = { version = "2.0", features = ["zeroize"] }
rand = { version = "0.10.0", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] }
blake3 = "1.8"
zeroize = "1.8.2"
argon2 = "0.5"
bip39 = "2.0"

# Serialization & Errors
postcard = { version = "1.1.3", features = ["alloc"] }
thiserror = "2.0.18"
anyhow = "1.0"
oneshot = { version = "0.2.1", features = ["async"] }

# Export
c2pa = { version = "0.78.0", default-features = false, features = ["rust_native_crypto", "file_io"] }
serde_json = "1"

# System
ctrlc = "3.5.2"

# GUI (optional, feature-gated)
eframe = { version = "0.30", optional = true, default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.15", optional = true }

[features]
default = []
gui = ["eframe", "rfd"]

[dev-dependencies]
tempfile = "3.26.0"
oneshot = { version = "0.2.1", features = ["async"] }
phalanx-test-fixtures = { workspace = true }

[lints]
workspace = true
