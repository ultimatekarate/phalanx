[package]
name = "phalanx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "stronghold"
path = "src/bin/stronghold.rs"

[dependencies]
# --- Async Runtime ---
tokio = { version = "1.0", features = ["full", "test-util"] }

# --- Logging ---
env_logger = "0.11"
log = "0.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Security & Identity ---
# rand_core feature is mandatory for the .generate() method
# This is such a shitty hack and I hate it. 
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand = "0.9.2"
hex = "0.4"
dalek_rand = { package = "rand_core", version = "0.6.4", features = ["std"] }
bs58 = "0.5.1"

# --- Data & Utilities ---
serde = { version = "1.0", features = ["derive"] } 
serde_json = "1.0.149"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
toml = "0.9.8"
ctrlc = "3.4"
chrono = "0.4.43"
void = "1.0.2"
bip39 = "2.0"

# --- Hardware & Media ---
nokhwa = { version = "0.10", features = ["input-msmf"] }
ndarray = "0.17.2"
image = { version = "0.25.9", features = ["jpeg"] }
tracing-appender = "0.2.4"
chacha20poly1305 = "0.10.1"
sntpc = { version = "0.3", features = ["std", "utils"] }
io = "0.0.2"
futures = "0.3.31"
thiserror = "2.0.18"
base64 = "0.22.1"
sha2 = "0.10.9"
curve25519-dalek = "4.1.3"
x25519-dalek = {version = "2.0.1", features = ["static_secrets"]}
tempfile = "3.25.0"
redb = "3.1.0"
async-trait = "0.1.89"

# --- Networking (Consolidated) ---
[dependencies.libp2p]
version = "0.56"
features = [
    "tcp",
    "dns", 
    "quic",       
    "ping",     
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "pnet",
    "kad",
    "identify",
    "macros",
    "tokio",
    "relay",
    "dcutr",
    "autonat",
    "request-response"
]

[features]
default = []
edge = []
sim = ["tokio/full"]
