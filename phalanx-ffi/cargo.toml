[package]
name = "phalanx-ffi"
version = "0.1.0"
edition = "2021"

[lib]
# "cdylib" is required for dynamic linking with Dart (Flutter) or Swift.
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Link to the sibling crate in the workspace
phalanx-core = { path = "../phalanx-core" }
tokio = { version = "1.0", features = ["full"] }
# FFI helper crates for clinical memory safety
libc = "0.2"
# Required for passing complex types to the Mobile UI safely
postcard = { version = "1.1.3", features = ["alloc"] }
# we're doing java stuff
jni = "0.21"