name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

  build-android:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Locate NDK Toolchain
        id: ndk
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build Android Static Library (Release)
        env:
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.toolchain }}/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.toolchain }}/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.toolchain }}/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.toolchain }}/bin/aarch64-linux-android24-clang
          CFLAGS_aarch64_linux_android: -I${{ github.workspace }}/crates/phalanx-ffi/android-stubs
          CXXFLAGS_aarch64_linux_android: -I${{ github.workspace }}/crates/phalanx-ffi/android-stubs
        run: cargo build --release --target aarch64-linux-android -p phalanx-ffi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phalanx-android-lib
          path: target/aarch64-linux-android/release/libphalanx_ffi.so

  build-ios:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install nasm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Generate C Headers
        run: cbindgen --config cbindgen.toml --crate phalanx-ffi --output phalanx-ffi/phalanx.h

      - name: Build iOS Static Library (Release)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --release --target aarch64-apple-ios -p phalanx-ffi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phalanx-ios-lib
          path: |
            target/aarch64-apple-ios/release/libphalanx_ffi.a
            phalanx-ffi/phalanx.h
