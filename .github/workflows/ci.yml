name: CI

on:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Supply chain check
        run: cargo deny check bans

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check unused workspace dependencies
        run: cargo machete

      - name: Clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

  build-android:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Locate NDK Toolchain
        id: ndk
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build Android Static Library (Release)
        env:
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.toolchain }}/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.toolchain }}/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.toolchain }}/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.toolchain }}/bin/aarch64-linux-android24-clang
          CFLAGS_aarch64_linux_android: -I${{ github.workspace }}/crates/phalanx-ffi/android-stubs
          CXXFLAGS_aarch64_linux_android: -I${{ github.workspace }}/crates/phalanx-ffi/android-stubs
        run: cargo build --release --target aarch64-linux-android -p phalanx-ffi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phalanx-android-lib
          path: target/aarch64-linux-android/release/libphalanx_ffi.so

  build-ios:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install nasm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-aarch64

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Generate C Headers
        run: cbindgen --config cbindgen.toml --crate phalanx-ffi --output phalanx-ffi/phalanx.h

      - name: Build iOS Static Library (Release)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --release --target aarch64-apple-ios -p phalanx-ffi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phalanx-ios-lib
          path: |
            target/aarch64-apple-ios/release/libphalanx_ffi.a
            phalanx-ffi/phalanx.h

  # Manual performance-comparison job. Benchmarks the dispatched branch against
  # `main` and prints a critcmp table to the run summary. Informational only —
  # GitHub-hosted runners are too noisy for a hard regression gate.
  bench:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Benchmark the current branch
        run: cargo bench -p phalanx-forensics -- --save-baseline current

      - name: Benchmark the main baseline
        run: |
          git fetch origin main
          git checkout origin/main
          cargo bench -p phalanx-forensics -- --save-baseline main

      - name: Compare against main (informational — not a gate)
        run: |
          {
            echo '### Benchmark comparison — main vs current'
            echo
            echo '```'
            critcmp main current 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
